<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search API — Поиск изображений</title>
  <link rel="stylesheet" href="{{ root_path }}/static/css/style.css">
</head>
<body>
  <div class="container">
    <div class="page-header">
      <img src="https://storage.yandexcloud.net/cloud-www-assets/main-icons/light/desktop/logo.svg"
           alt="Yandex Cloud" class="yc-logo">
      <div>
        <h1><span class="h1-super">Search API</span>Поиск изображений</h1>
        <nav class="doc-links">
          <a href="https://aistudio.yandex.ru/docs/ru/search-api/concepts/image-search.html" target="_blank" rel="noopener">Обзор</a>
          <a href="https://aistudio.yandex.ru/docs/ru/search-api/operations/search-images-by-pic.html" target="_blank" rel="noopener">Поиск по изображению</a>
          <a href="https://aistudio.yandex.ru/docs/ru/search-api/operations/search-images.html" target="_blank" rel="noopener">Поиск по описанию</a>
          <a href="https://aistudio.yandex.ru/docs/ru/search-api/api-ref/ImageSearch/" target="_blank" rel="noopener">API Reference</a>
          <a href="https://aistudio.yandex.ru/docs/ru/search-api/pricing.html" target="_blank" rel="noopener">Тарифы</a>
        </nav>
      </div>
    </div>

    <div class="mode-toggle" id="modeToggle">
      <button type="button" class="mode-btn active" data-mode="image">По изображению</button>
      <button type="button" class="mode-btn" data-mode="text">По описанию</button>
    </div>

    <form id="searchForm" autocomplete="off">
      <div id="imageModeFields">
      <div class="upload-area" id="uploadArea">
        <input type="file" id="fileInput" accept="image/*" hidden>
        <div id="uploadPlaceholder">
          <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          <p>Перетащите изображение сюда<br>или <button type="button" id="browseBtn">выберите файл</button></p>
        </div>
        <div id="uploadPreview" class="upload-preview hidden">
          <img id="previewImg" src="" alt="preview">
          <button type="button" id="clearFileBtn" class="clear-btn" title="Убрать">✕</button>
        </div>
      </div>

      <div class="divider"><span>или</span></div>

      <div class="form-group">
        <label for="imageUrl">Ссылка на изображение</label>
        <div class="input-with-clear">
          <input type="url" id="imageUrl" placeholder="https://example.com/image.jpg" autocomplete="off">
          <button type="button" id="clearUrlBtn" class="input-clear-btn hidden" title="Очистить">✕</button>
        </div>
      </div>

      <div class="form-group">
        <label for="imageFamily">Семейный фильтр</label>
        <select id="imageFamily">
          <option value="FAMILY_MODE_MODERATE">умеренный</option>
          <option value="FAMILY_MODE_NONE">выключен</option>
          <option value="FAMILY_MODE_STRICT">строгий</option>
        </select>
      </div>
      </div><!-- /#imageModeFields -->

      <div id="textModeFields" class="hidden">
        <div class="form-group">
          <label for="queryInput">Текстовый запрос</label>
          <input type="text" id="queryInput" placeholder="например: котята на снегу" autocomplete="off">
        </div>

        <div class="form-row form-row--filters">
          <div class="form-group">
            <label for="imgFormat">Формат</label>
            <select id="imgFormat">
              <option value="">любой</option>
              <option value="IMAGE_FORMAT_JPEG">JPEG</option>
              <option value="IMAGE_FORMAT_PNG">PNG</option>
              <option value="IMAGE_FORMAT_GIF">GIF</option>
            </select>
          </div>
          <div class="form-group">
            <label for="imgSize">Размер</label>
            <select id="imgSize">
              <option value="">любой</option>
              <option value="IMAGE_SIZE_ENORMOUS">очень большой</option>
              <option value="IMAGE_SIZE_LARGE">большой</option>
              <option value="IMAGE_SIZE_MEDIUM">средний</option>
              <option value="IMAGE_SIZE_SMALL">маленький</option>
              <option value="IMAGE_SIZE_TINY">очень маленький</option>
              <option value="IMAGE_SIZE_WALLPAPER">обои</option>
            </select>
          </div>
          <div class="form-group">
            <label for="imgOrientation">Ориентация</label>
            <select id="imgOrientation">
              <option value="">любая</option>
              <option value="IMAGE_ORIENTATION_HORIZONTAL">горизонтальная</option>
              <option value="IMAGE_ORIENTATION_VERTICAL">вертикальная</option>
              <option value="IMAGE_ORIENTATION_SQUARE">квадратная</option>
            </select>
          </div>
          <div class="form-group">
            <label for="imgColor">Цвет</label>
            <select id="imgColor">
              <option value="">любой</option>
              <option value="IMAGE_COLOR_COLOR">цветной</option>
              <option value="IMAGE_COLOR_GRAYSCALE">ч/б</option>
              <option value="IMAGE_COLOR_RED">красный</option>
              <option value="IMAGE_COLOR_ORANGE">оранжевый</option>
              <option value="IMAGE_COLOR_YELLOW">жёлтый</option>
              <option value="IMAGE_COLOR_GREEN">зелёный</option>
              <option value="IMAGE_COLOR_CYAN">голубой</option>
              <option value="IMAGE_COLOR_BLUE">синий</option>
              <option value="IMAGE_COLOR_VIOLET">фиолетовый</option>
              <option value="IMAGE_COLOR_WHITE">белый</option>
              <option value="IMAGE_COLOR_BLACK">чёрный</option>
            </select>
          </div>
          <div class="form-group">
            <label for="familyMode">Семейный фильтр</label>
            <select id="familyMode">
              <option value="FAMILY_MODE_MODERATE">умеренный</option>
              <option value="FAMILY_MODE_NONE">выключен</option>
              <option value="FAMILY_MODE_STRICT">строгий</option>
            </select>
          </div>
          <div class="form-group">
            <label for="searchType">Регион поиска</label>
            <select id="searchType">
              <option value="SEARCH_TYPE_RU">Россия</option>
              <option value="SEARCH_TYPE_COM">Международный</option>
              <option value="SEARCH_TYPE_TR">Турция</option>
              <option value="SEARCH_TYPE_KK">Казахстан</option>
              <option value="SEARCH_TYPE_BE">Беларусь</option>
              <option value="SEARCH_TYPE_UZ">Узбекистан</option>
            </select>
          </div>
        </div>

        <label class="form-check">
          <input type="checkbox" id="fixTypo" checked>
          <span>Исправлять опечатки в запросе</span>
        </label>
      </div><!-- /#textModeFields -->

      <div class="form-row">
        <div class="form-group">
          <label for="siteFilter">Домен для поиска <span class="optional">(необязательно)</span></label>
          <input type="text" id="siteFilter" placeholder="example.com" autocomplete="off">
        </div>
        <div class="form-group form-group--narrow">
          <label for="limitInput">Кол-во результатов</label>
          <input type="number" id="limitInput" value="20" min="1" max="500" autocomplete="off">
        </div>
      </div>

      <button type="submit" id="searchBtn">Поиск</button>
    </form>

    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <span>Идёт поиск...</span>
    </div>

    <div id="errorMsg" class="error hidden"></div>

    <div id="tabSection" class="tab-section hidden">
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="results">Результаты <span id="tabResultsCount" class="tab-count"></span></button>
        <button class="tab-btn" data-tab="request">Request</button>
        <button class="tab-btn" data-tab="response">Response</button>
      </div>

      <div id="tabResults" class="tab-panel">
        <div id="results" class="results-grid"></div>
      </div>

      <div id="tabRequest" class="tab-panel hidden">
        <pre id="debugRequest" class="json-pre"></pre>
      </div>

      <div id="tabResponse" class="tab-panel hidden">
        <pre id="debugResponse" class="json-pre"></pre>
      </div>
    </div>
  </div>

  <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true">
    <button id="lightboxClose" class="lightbox-close" aria-label="Закрыть">✕</button>
    <div class="lightbox-backdrop"></div>
    <div class="lightbox-content">
      <img id="lightboxImg" src="" alt="">
      <a id="lightboxSource" href="#" target="_blank" rel="noopener" class="lightbox-source-link">Открыть страницу источника ↗</a>
    </div>
  </div>

  <script src="{{ root_path }}/static/js/main.js"></script>
</body>
</html>
